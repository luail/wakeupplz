<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WakeUpPlz 아이콘 시안</title>
<style>
:root{--bg:#F8F9FA;--text:#1A1D21;--sub:#6B7280;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1A1816;--text:#F5F4F2;--sub:#A8A29E;--card:#24221F}}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,system-ui,sans-serif;padding:32px 16px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--sub);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:960px}
.card{background:var(--card);border-radius:24px;padding:20px}
.card h2{font-size:17px;margin:0 0 4px}.card span{color:var(--sub);font-size:14px}
.pair{display:flex;gap:14px;margin-top:16px}
.pair figure{margin:0;text-align:center;font-size:12px;color:var(--sub)}
.pair img{width:110px;height:110px;border-radius:24px;display:block;margin-bottom:6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.home{display:flex;gap:18px;margin-top:16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#8a7a68,#3d3a36)}
.home img{width:56px;height:56px;border-radius:13px}
</style></head><body>
<h1>WakeUpPlz 아이콘 시안</h1><p>왼쪽 라이트 · 오른쪽 다크, 아래는 배경화면 위 실제 크기 느낌이에요.</p>
<div class="grid">
<div class="card"><h2>① 새벽 수평선</h2><span>수평선 위로 떠오르는 해. 가장 차분하고 고급스러운 느낌</span>
<div class="pair"><figure><img src="a-dawn-light.svg">라이트</figure><figure><img src="a-dawn-dark.svg">다크</figure></div>
<div class="home"><img src="a-dawn-light.svg"><img src="a-dawn-dark.svg"></div></div>
<div class="card"><h2>② 채팅 인증</h2><span>‘일어났어!’ 말풍선 인증 + 떠오르는 해. 앱 기능이 가장 잘 드러남</span>
<div class="pair"><figure><img src="b-bubble-light.svg">라이트</figure><figure><img src="b-bubble-dark.svg">다크</figure></div>
<div class="home"><img src="b-bubble-light.svg"><img src="b-bubble-dark.svg"></div></div>
<div class="card"><h2>③ 알람시계 체크</h2><span>클래식 알람시계 + 인증 체크. 한눈에 알람 앱임을 알 수 있음</span>
<div class="pair"><figure><img src="c-ring-light.svg">라이트</figure><figure><img src="c-ring-dark.svg">다크</figure></div>
<div class="home"><img src="c-ring-light.svg"><img src="c-ring-dark.svg"></div></div>
</div></body></html>
